<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <title>Thư mời tốt nghiệp · Lưu Cao Hoàng</title>
  <link rel="icon" href="../static/invitation/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Hẹn bạn ở lễ tốt nghiệp của Hoàng, 09:00–12:00 ngày 07/11/2026 tại Đại học FPT HCM.">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hoàng có một lời mời dành cho bạn · Graduation 2026">
  <meta property="og:description" content="Cùng chia sẻ niềm vui và lưu lại một tấm hình. 07/11/2026 · Đại học FPT HCM.">
</head>

<body>
  <noscript><p style="color:white;padding:24px">Thư mời lễ tốt nghiệp của Lưu Cao Hoàng · 09:00–12:00 ngày 07/11/2026 tại Đại học FPT HCM. Bạn hãy bật JavaScript để mở thư và hồi âm.</p></noscript>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay playsinline width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay playsinline width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
